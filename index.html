<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIAMONS LEGION</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131c2e;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --primary-blue: #0ea5e9;
            --border-color: #1e293b;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            min-height: 100vh;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        /* NOTIFICACIÓN TOAST */
        #notification-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-200px);
            background: #1e293b; color: #ffffff; border: 1px solid var(--primary-blue);
            padding: 0.8rem 1.4rem; border-radius: 12px; font-weight: 700; font-size: 0.82rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 999999; width: 90%; max-width: 380px; text-align: center;
        }
        #notification-toast.show { transform: translateX(-50%) translateY(0); }

        /* AUTENTICACIÓN */
        .auth-wrapper {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; width: 100%;
        }
        .auth-container {
            max-width: 390px; width: 100%; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 20px; padding: 2rem 1.6rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h1 {
            font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; color: var(--text-main); letter-spacing: 1px;
        }
        .brand-header h1 span { color: var(--primary-blue); }

        .auth-tabs {
            display: flex; gap: 6px; margin-bottom: 20px; background: #0b0f19;
            border-radius: 10px; padding: 4px; border: 1px solid var(--border-color);
        }
        .auth-tab {
            flex: 1; text-align: center; padding: 0.6rem; font-weight: bold;
            font-size: 0.82rem; cursor: pointer; border-radius: 8px; color: var(--text-muted); background: transparent; border: none; transition: all 0.3s;
        }
        .auth-tab.active { background: var(--primary-blue); color: #fff; }

        .form-group { margin-bottom: 1.1rem; position: relative; }
        .form-group label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.3rem; font-weight: 600; }
        .form-control {
            width: 100%; background: #0b0f19; border: 1px solid var(--border-color);
            padding: 0.75rem 1rem; border-radius: 10px; color: var(--text-main);
            font-size: 0.88rem; outline: none; transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--primary-blue); }

        .btn-main {
            width: 100%; background: var(--primary-blue); color: #fff; border: none;
            padding: 0.8rem; border-radius: 10px; font-weight: 900; font-size: 0.9rem;
            cursor: pointer; transition: filter 0.2s, transform 0.2s; margin-top: 0.8rem;
        }
        .btn-main:hover { filter: brightness(1.05); transform: translateY(-1px); }

        /* DASHBOARD PRINCIPAL */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 1rem; background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
        }
        .nav-brand-title { font-family: 'Orbitron', sans-serif; font-size: 0.95rem; font-weight: 900; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .nav-brand-title span { color: var(--primary-blue); }

        .nav-wallet-pills { display: flex; gap: 6px; align-items: center; }
        .wallet-pill-top {
            background: #0b0f19; border: 1px solid var(--border-color); padding: 4px 10px;
            border-radius: 16px; font-size: 0.72rem; color: var(--primary-blue); font-weight: 800; display: flex; align-items: center; gap: 4px; cursor: pointer;
        }

        .container { max-width: 500px; width: 100%; margin: 0 auto; padding: 1rem; flex: 1; display: flex; flex-direction: column; padding-bottom: 95px; }

        .section-title { font-size: 0.78rem; color: var(--text-muted); margin: 0.8rem 0 0.5rem 0; font-weight: 700; letter-spacing: 0.5px; }

        /* RECARGA ID */
        .top-recharge-showcase {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid var(--primary-blue); border-radius: 20px;
            padding: 1.2rem; text-align: center; margin-bottom: 1rem;
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.25);
        }
        .top-recharge-showcase img {
            width: 120px; height: auto; filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
            margin-bottom: 8px; animation: floatDiamond 3s ease-in-out infinite;
        }
        @keyframes floatDiamond {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .top-recharge-showcase input {
            background: #0b0f19; border: 1px solid var(--primary-blue); color: #fff; text-align: center; font-weight: 800;
        }

        /* PESTAÑAS */
        .tabs-selector-box {
            display: flex; background: var(--bg-card); border-radius: 16px; padding: 4px; gap: 4px; margin-bottom: 1rem; border: 1px solid var(--border-color);
        }
        .tab-sel-btn {
            flex: 1; text-align: center; padding: 0.75rem; font-weight: 800; font-size: 0.82rem;
            border-radius: 12px; cursor: pointer; border: none; background: transparent; color: var(--text-muted); transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .tab-sel-btn.active {
            background: var(--primary-blue); color: #fff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        /* GRID DE PAQUETES */
        .diamonds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1rem; }
        .diamond-card {
            background: var(--bg-card); border: 1.5px solid var(--border-color); border-radius: 16px;
            padding: 1rem 0.8rem; text-align: center; cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .diamond-card:hover, .diamond-card.selected { border-color: var(--primary-blue); background: #172554; }
        .diamond-img-icon { width: 55px; height: auto; margin-bottom: 8px; filter: drop-shadow(0 4px 8px rgba(14, 165, 233, 0.4)); }
        .diamond-card h4 { font-size: 0.82rem; font-weight: 900; color: var(--text-main); }
        .diamond-price { color: var(--primary-blue); font-weight: 900; font-size: 0.9rem; margin-top: 4px; }

        .payment-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 1.2rem; }
        .pay-btn {
            background: var(--bg-card); border: 1.5px solid var(--border-color); border-radius: 12px;
            padding: 0.75rem; text-align: center; font-size: 0.82rem; font-weight: 800; color: var(--text-main); cursor: pointer;
        }
        .pay-btn.active { border-color: var(--primary-blue); color: var(--primary-blue); background: #172554; }

        /* ESTILO PROFESIONAL DE COMPROBANTE DE PEDIDO (IDÉNTICO A REFERENCIA) */
        .pro-order-receipt {
            background: linear-gradient(145deg, #162032, #0d1424);
            border: 1px solid #334155; border-radius: 18px; padding: 1.2rem; margin-bottom: 1rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4); position: relative;
        }
        .pro-receipt-header {
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 0.8rem; margin-bottom: 0.8rem;
        }
        .pro-receipt-title-box { display: flex; align-items: center; gap: 10px; }
        .pro-receipt-title-box img { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--primary-blue); }
        .pro-receipt-title-box h4 { font-size: 0.95rem; font-weight: 900; color: #fff; }
        .pro-receipt-title-box span { font-size: 0.7rem; color: var(--text-muted); display: block; }
        
        .badge-status {
            font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 4px;
        }
        .badge-status.proceso { background: rgba(217, 119, 6, 0.15); color: #f59e0b; border: 1px solid rgba(217, 119, 6, 0.3); }
        .badge-status.entregado { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        /* LÍNEA DE PROGRESO PASO A PASO */
        .progress-steps {
            display: flex; justify-content: space-between; align-items: center; margin: 1.2rem 0; position: relative; padding: 0 10px;
        }
        .progress-steps::before {
            content: ''; position: absolute; top: 12px; left: 30px; right: 30px; height: 3px; background: #334155; z-index: 1;
        }
        .step-item { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
        .step-circle {
            width: 26px; height: 26px; border-radius: 50%; background: #1e293b; border: 2px solid #475569;
            display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px;
        }
        .step-item.active .step-circle { background: var(--success-color); border-color: #6ee7b7; color: #fff; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .step-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; text-align: center; }
        .step-item.active .step-label { color: #fff; }

        .receipt-details-grid { font-size: 0.75rem; color: #cbd5e1; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #1e293b; padding-top: 0.8rem; }
        .receipt-row { display: flex; justify-content: space-between; align-items: center; }
        .receipt-row span:first-child { color: var(--text-muted); }
        .receipt-row span:last-child { font-weight: 700; color: #fff; }

        /* PANEL ADMIN */
        .admin-panel-box {
            background: #1e293b; color: #fff; border-radius: 16px; padding: 1.2rem; margin-top: 1.5rem;
            border: 2px dashed #38bdf8;
        }
        .admin-req-card {
            background: #0f172a; border-radius: 10px; padding: 0.8rem; margin-top: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem;
        }
        .admin-btns { display: flex; gap: 6px; }
        .btn-approve { background: var(--success-color); color: #fff; border: none; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-reject { background: var(--error-color); color: #fff; border: none; padding: 5px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* WALLET STYLES */
        .wallet-card-option {
            background: var(--bg-card); border: 1.5px solid var(--border-color); border-radius: 16px;
            padding: 1.1rem; margin-bottom: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s;
        }
        .wallet-card-option:hover { border-color: var(--primary-blue); }
        .wallet-card-left { display: flex; align-items: center; gap: 12px; }
        .wallet-icon-box {
            width: 40px; height: 40px; background: #172554; border: 1px solid #1e3a8a;
            border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--primary-blue); font-size: 1rem;
        }
        .wallet-info h4 { font-size: 0.9rem; font-weight: 900; color: var(--text-main); margin-bottom: 2px; }
        .wallet-info p { font-size: 0.68rem; color: var(--text-muted); }
        .wallet-box-detail {
            background: var(--bg-card); border: 1px solid var(--primary-blue); border-radius: 16px; padding: 1.2rem; margin-bottom: 1rem;
        }
        .wallet-address-box {
            background: #0b0f19; border: 1px solid var(--border-color); padding: 0.75rem; border-radius: 10px;
            font-size: 0.72rem; word-break: break-all; color: var(--primary-blue); font-weight: bold; margin: 0.6rem 0 0.8rem 0;
        }

        /* NAVEGACIÓN INFERIOR */
        .app-bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-card);
            border-top: 1px solid var(--border-color); display: flex; justify-content: space-around;
            padding: 10px 0; z-index: 1000;
        }
        .nav-item-btn {
            background: transparent; border: none; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            font-size: 9px; text-transform: uppercase; font-weight: 700; cursor: pointer; flex: 1; transition: color 0.3s;
        }
        .nav-item-btn i { font-size: 16px; }
        .nav-item-btn.active, .nav-item-btn:hover { color: var(--primary-blue); }

        .hidden { display: none !important; }
    </style>
</head>

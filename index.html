<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIAMONS LEGION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #030614;
            --bg-card: #091026;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --primary-neon: #00f7ff;
            --accent-neon: #7209b7;
            --border-color: #1b3a6b;
            --neon-glow: 0 0 20px rgba(0, 247, 255, 0.3);
            --neon-glow-strong: 0 0 35px rgba(0, 247, 255, 0.6);
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--neon-glow);
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 40px;
        }
        h1, h2 {
            text-align: center;
            color: var(--primary-neon);
            text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #030614;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 5px;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }
        input:focus {
            border-color: var(--primary-neon);
            outline: none;
            box-shadow: var(--neon-glow);
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary-neon);
            color: var(--bg-main);
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: var(--neon-glow);
            font-family: 'Orbitron', sans-serif;
            transition: 0.3s;
        }
        button:hover {
            background: #00bcd4;
            box-shadow: var(--neon-glow-strong);
        }
        .tab {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .tab span {
            cursor: pointer;
            color: var(--text-muted);
            font-weight: bold;
        }
        .tab span.active {
            color: var(--primary-neon);
            border-bottom: 2px solid var(--primary-neon);
            text-shadow: 0 0 8px rgba(0, 247, 255, 0.5);
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <h1>DIAMONS LEGION</h1>
    
    <div class="container">
        <div class="tab">
            <span id="tab-login" class="active" onclick="switchTab('login')">INICIAR SESIÓN</span>
            <span id="tab-register" onclick="switchTab('register')">REGISTRARSE</span>
        </div>

        <!-- Formulario de Login -->
        <div id="login-form" class="form-section active">
            <h2>LOGIN</h2>
            <input type="text" id="login-user" placeholder="Usuario o Email">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button onclick="handleLogin()">INGRESAR</button>
        </div>

        <!-- Formulario de Registro -->
        <div id="register-form" class="form-section">
            <h2>REGISTRO</h2>
            <input type="text" id="reg-user" placeholder="Usuario">
            <input type="email" id="reg-email" placeholder="Correo electrónico">
            <input type="password" id="reg-pass" placeholder="Contraseña (6+ dígitos)">
            <button onclick="handleRegister()">CREAR CUENTA</button>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('login-form').classList.add('active');
                document.getElementById('register-form').classList.remove('active');
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
            } else {
                document.getElementById('register-form').classList.add('active');
                document.getElementById('login-form').classList.remove('active');
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
            }
        }

        // Registro conectado a Cloudflare D1
        async function handleRegister() {
            const username = document.getElementById('reg-user').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-pass').value.trim();

            if (!username || !email || !password) {
                alert("Por favor completa todos los campos.");
                return;
            }

            try {
                let response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                let data = await response.json();
                
                if (data.success) {
                    alert("¡Registro exitoso guardado en la nube!");
                    switchTab('login');
                } else {
                    alert("Error: " + (data.message || "No se pudo registrar"));
                }
            } catch (err) {
                alert("Error de conexión con el servidor.");
            }
        }

        // Login conectado a Cloudflare D1
        async function handleLogin() {
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value.trim();

            if (!username || !password) {
                alert("Por favor ingresa usuario y contraseña.");
                return;
            }

            try {
                let response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                let data = await response.json();
                
                if (data.success) {
                    alert("¡Bienvenido, " + data.username + "!");
                } else {
                    alert("Usuario o contraseña incorrectos.");
                }
            } catch (err) {
                alert("Error de conexión con el servidor.");
            }
        }
    </script>
</body>
</html>
